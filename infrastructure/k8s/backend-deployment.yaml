apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanexus-backend-deployment
  namespace: default
  labels:
    app: datanexus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: datanexus-backend
  template:
    metadata:
      labels:
        app: datanexus-backend
    spec:
      containers:
      - name: control-api-server
        image: gcr.io/uwinezahappy2/datanexus-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: DB_USER
          value: "nexus_admin"
        - name: DB_PASSWORD
          value: "secure_password123"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
